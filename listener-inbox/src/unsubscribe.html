<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe · Two Hallucinating PMs</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root { --paper: #fbf3e2; --dots: rgba(21, 19, 31, 0.07); --surface: #fffaf0; --text: #15131f; --line: #15131f; --shade: #15131f; --muted: #5d5a6b; --lime: #b4f01c; --pink: #ff3ea5; --yellow: #ffe83a; --on-accent: #15131f; --display: "Lilita One", "Nunito", sans-serif; --body: "Nunito", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --paper: #1b1f2c; --dots: rgba(255, 255, 255, 0.06); --surface: #262b3a; --text: #f4efe4; --line: #0b0d14; --shade: #0b0d14; --muted: #b3aec2; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: var(--body); color: var(--text); background: var(--paper) radial-gradient(var(--dots) 1.2px, transparent 1.4px) 0 0 / 14px 14px; display: grid; place-items: start center; padding: 24px 20px 64px; }
main { width: 100%; max-width: 30rem; display: grid; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-family: var(--display); font-size: 1.15rem; }
.brand img { width: 44px; height: 44px; filter: drop-shadow(2px 2px 0 var(--shade)); }
.card { background: var(--surface); border: 3px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: 6px 6px 0 var(--pink), 6px 6px 0 3px var(--shade); display: grid; gap: 14px; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.8rem; line-height: 1.1; }
p { margin: 0; font-weight: 600; }
.muted { color: var(--muted); }
input[type=email] { width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 2.5px solid var(--line); border-radius: 14px; padding: 11px 14px; box-shadow: 3px 3px 0 var(--shade); }
input[type=email]:focus { outline: none; box-shadow: 3px 3px 0 var(--pink); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
button { font: inherit; font-weight: 800; color: var(--on-accent); background: var(--yellow); border: 2.5px solid var(--line); border-radius: 999px; padding: 10px 18px; box-shadow: 3px 3px 0 var(--shade); cursor: pointer; justify-self: start; }
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shade); }
.err { color: var(--on-accent); background: var(--pink); border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 700; }
a { color: var(--text); text-decoration-color: var(--pink); text-decoration-thickness: 2px; font-weight: 700; }
</style>
</head>
<body>
<main>

  <div class="card">

</main>
</body>
</html>
